<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Kendo UI for jQuery Template Project</title>
        <link rel="shortcut icon" href="assets/images/employees/favicon.ico" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://kendo.cdn.telerik.com/themes/12.2.2/default/default-main.css"></link>
        <link rel="stylesheet" href="./assets/styles/site.css"></link>
    </head>
    <body>
        <script type="text/x-kendo-tmpl" id="employeeItemTemplate">
            <div class="employee">
                <div class="employee-wrapper">
                    <img src="./assets/images/employees/#:EmployeeID#.png" class="img-responsive employee-list-image" />
                    <dl class="employee-list-details">
                        <dt class="name">#:FirstName# #:LastName# </dt>
                        <dd class="title">#:Title# </dd>
                    </dl>
                </div>
            </div>
        </script>
        <script type="text/x-kendo-tmpl" id="employeeBioTemplate">
            <div>
                <h3>ABOUT</h3>
                <img src="./assets/images/employees/#:EmployeeID#.png" class="img-responsive employee-details-image" />
                <dl class="employee-bio-details">
                    <dt class="name">#:FirstName# #:LastName#</dt>
                    <dd class="title">#:Title#</dd>
                    <dd class="phone"><span class="icon icon-mobile"></span>#:HomePhone#</dd>
                    <dd><a href='\\#' class='bioTooltip'> >>FULL BIO <span style='display:none;'>#:Notes#</span></a></dd>
                </dl>
            </div>
        </script>
        
         <div id="grid"></div><div class="container-fluid">
            <!--open container-->
            <div class="row row-offcanvas row-offcanvas-left">
                <div id="main-section" class="col-xs-12 column">
                    <div id="main-section-header" class="row align-items-center justify-content-between">
                        <h2 id="team-efficiency" class="col-sm-3">Team efficiency</h2>
                        <div id="dateFilter" class="col-sm-9">
                            <div class="period-wrapper">
                                <label for="StartDate" class="select-period">Stats from</label>
                                <input id="start-date" style="width: 150px"/>
                                <span class="k-invalid-msg" data-for="StartDate"></span>
                            </div>
                            <div class="period-wrapper">
                                <label for="EndDate" class="select-period">To</label>
                                <input id="end-date" style="width: 150px" />
                                <span class="k-invalid-msg" data-for="EndDate"></span>
                            </div>
                        </div>
                    </div>
        
                    <div class="main-section-content row" style="">
        
                        <div id="employee-list" class="col col-2">
                            <h3>TEAM MEMBERS</h3>
                            <div id="employees-list"></div>
                        </div>
                        <div id="employee-details-wrapper" class="col col-10">
                            <div id="employee-details" class="row">
                                <div id="employee-about" class="col-12 placeholder">
                                    <div class="row">
                                        <div id="employeeBio" class="col-12 col-sm-4">
                                        </div>
                                        <div class="col-12 col-sm-4">
                                            <h3>Quarter to date sales</h3>
                                            <span id="employee-quarter-sales-label"></span>
                                            <div class="sparkline-container">
                                                <div id="employee-quarter-sales" style="height:30px"></div>
                                            </div>
                                        </div>
                                        <div class="col-12 col-sm-4">
                                            <h3>Monthly Average Sales</h3>
                                            <span id="employee-average-sales-label"></span>
                                            <div class="sparkline-container">
                                                <div id="employee-average-sales" style="height:30px"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div id="employeeStats" class="col-12">
                                    <div id="team-sales" style="height:200px"></div>
                                </div>
                                <div id="employeeSchedule" class="col-12">
                                    <h3>Representative orders - schedule</h3>
                                    <div id="employee-sales"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--close main column-->
            </div>
            <!--close row-->
        </div>
        <footer class="footer text-center d-flex align-items-center">
            <div class="container-fluid">
                <p class="text-muted">Copyright © <span id="currentYear"></span> Progress Software Corporation and/or its subsidiaries or affiliates. All Rights Reserved.</p>
            </div>
        </footer>
    </body>
</html>
